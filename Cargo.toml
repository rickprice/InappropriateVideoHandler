[package]
name = "inappropriate-video-handler"
version = "0.5.0"
edition = "2024"

[lib]
name = "inappropriate_video_handler"
path = "src/lib.rs"

[[bin]]
name = "inappropriate-video-handler"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
x11 = { version = "2.21", features = ["xlib"] }
nix = { version = "0.31", features = ["signal", "process"] }
anyhow = "1.0"
log = "0.4"
fern = "0.7"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3.8"
serial_test = "4.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
